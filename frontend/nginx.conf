server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;   # Excel product imports (the backend allows 10 MB)
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # backend trusts only the last TRUSTED_PROXIES hops
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI assistant and report generation can take a while
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
